<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0B0C0A">
<title>컨텐츠 마스터즈</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="v2-manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ═══════════════ 컨마 v2 · 유리 기준 (2026-08-22 픽 A) ═══════════════
   원칙: 뼈대 한 벌 + 방은 «광원 색»만 갈아 끼운다 (상위호환 인테리어) */
:root{
  --bg:#0A0D12;
  --glass:rgba(255,255,255,.055);
  --glass-line:rgba(255,255,255,.12);
  --glass-elev:rgba(255,255,255,.08);
  --hairline:rgba(255,255,255,.09);
  --text-main:#fff;
  --text-sub:rgba(255,255,255,.62);
  --text-mute:rgba(255,255,255,.45);
  --text-faint:rgba(255,255,255,.32);
  --wine:#E08585;--cream:#F5E6D3;--flare:#FF7A33;--lime:#d7f34b;--ice:#9BC4D9;
  /* 격 테이블 — 방마다 이 묶음만 바뀐다 */
  --tone:#9BC4D9;--tone-hi:#BFE0F0;--tone-ink:#0A0D12;
  --tone-glow:rgba(155,196,217,.22);
  --tone-line:rgba(155,196,217,.35);
  --tone-faint:rgba(155,196,217,.10);
  --orb2:rgba(120,140,255,.10);
  --r:16px;--dock-h:64px;
  --e-out:cubic-bezier(.23,1,.32,1);
  --e-inout:cubic-bezier(.77,0,.175,1);
  --e-ios:cubic-bezier(.32,.72,0,1);
  --e-press:cubic-bezier(.2,0,0,1);
}
[data-room="mid"]{--tone:#d7f34b;--tone-hi:#e6fb84;--tone-glow:rgba(215,243,75,.16);--tone-line:rgba(215,243,75,.36);--tone-faint:rgba(215,243,75,.09);--orb2:rgba(120,200,120,.08)}
[data-room="master"]{--tone:#F5E6D3;--tone-hi:#FBF3E6;--tone-glow:rgba(245,230,211,.17);--tone-line:rgba(245,230,211,.34);--tone-faint:rgba(245,230,211,.08);--orb2:rgba(255,200,120,.08)}
[data-room="community"]{--tone:#d7f34b;--tone-hi:#e6fb84;--tone-glow:rgba(215,243,75,.13);--tone-line:rgba(215,243,75,.32);--tone-faint:rgba(215,243,75,.07);--orb2:rgba(142,199,246,.09)}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{overscroll-behavior-y:none}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text-main);
 -webkit-font-smoothing:antialiased;min-height:100dvh}
/* 광원 두 개 — 방의 격은 여기서 바뀐다 */
body::before{content:'';position:fixed;top:-180px;right:-140px;width:560px;height:560px;border-radius:50%;
 background:radial-gradient(circle,var(--tone-glow),transparent 65%);filter:blur(30px);pointer-events:none;z-index:0;transition:background .5s}
body::after{content:'';position:fixed;bottom:-200px;left:-160px;width:520px;height:520px;border-radius:50%;
 background:radial-gradient(circle,var(--orb2),transparent 65%);filter:blur(30px);pointer-events:none;z-index:0;transition:background .5s}
button{font-family:inherit}
button:not(:disabled){transition:transform .2s cubic-bezier(.34,1.56,.64,1),background-color .15s ease,border-color .15s ease,color .15s ease,box-shadow .18s ease}
button:not(:disabled):active{transform:scale(.97)}
.wrap{max-width:480px;margin:0 auto;position:relative;z-index:1;padding-bottom:calc(var(--dock-h) + env(safe-area-inset-bottom) + 16px)}
.screen{display:none;animation:fadein .28s var(--e-out)}
.screen.on{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:none}}
@keyframes paneIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
#tabbody.pane{animation:paneIn 150ms var(--e-out)}
.item.pre,.slot.pre{opacity:0;transform:translateY(10px) scale(.97)}
.item,.slot{transition:opacity 180ms var(--e-out),transform 180ms var(--e-out),border-color .16s ease}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}.item.pre,.slot.pre{opacity:1;transform:none}}

/* ─── 공통 부품 (유리) ─── */
.top{padding:24px 18px 6px}
.hello{font-size:12px;color:var(--text-mute)}
.h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:5px;line-height:1.3}
.h1 em{font-style:normal;background:linear-gradient(120deg,var(--tone-hi),var(--tone));-webkit-background-clip:text;background-clip:text;color:transparent}
.badge{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:5px 11px;border-radius:999px;
 background:var(--tone-faint);border:1px solid var(--tone-line);font-size:11.5px;font-weight:700;color:var(--tone-hi)}
section{padding:0 18px;margin-top:22px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.09em;color:var(--text-faint);margin-bottom:10px}
.card{background:var(--glass);border:1px solid var(--glass-line);border-radius:var(--r);padding:16px;
 backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
 box-shadow:0 8px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.14)}
.card.hi{background:linear-gradient(150deg,var(--tone-faint),rgba(255,255,255,.04));border-color:var(--tone-line)}
.muted{color:var(--text-mute);font-size:12.5px;line-height:1.6}
.btn{display:block;width:100%;padding:15px;border-radius:14px;border:0;
 background:linear-gradient(160deg,var(--tone-hi),var(--tone));color:var(--tone-ink);
 font:800 15px Pretendard;cursor:pointer;box-shadow:0 6px 20px var(--tone-glow)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.ghost{background:transparent;border:1px solid var(--glass-line);color:var(--text-sub);font-weight:700;box-shadow:none}
.row{display:flex;gap:10px}
.inp{width:100%;padding:14px 15px;border-radius:13px;border:1px solid var(--glass-line);background:rgba(0,0,0,.28);
 color:var(--text-main);font:600 16px Pretendard;outline:none;transition:border-color .16s,box-shadow .16s}
.inp:focus{border-color:var(--tone-line);box-shadow:0 0 0 3px var(--tone-faint)}
.inp::placeholder{color:var(--text-faint)}
textarea.inp{resize:none;line-height:1.6;font-weight:500}
.robot{display:flex;gap:11px;align-items:flex-start;background:var(--glass);border:1px solid var(--glass-line);
 border-radius:14px;padding:13px 14px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.robot .face{width:34px;height:34px;border-radius:11px;flex:0 0 34px;display:grid;place-items:center;font-size:17px;
 background:var(--tone-faint);border:1px solid var(--tone-line)}
.robot p{font-size:13px;line-height:1.6;color:var(--text-sub)}
.robot p b{color:var(--text-main)}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.slot{aspect-ratio:3/4;border-radius:13px;background:rgba(255,255,255,.04);border:1px solid var(--hairline);
 display:grid;place-items:center;position:relative;overflow:hidden;padding:8px;text-align:center}
.slot.f{background:linear-gradient(160deg,var(--tone-faint),rgba(255,255,255,.03));border-color:var(--tone-line)}
.slot.f::after{content:'';position:absolute;left:10px;right:10px;bottom:10px;height:5px;border-radius:3px;background:var(--tone);opacity:.55}
.slot .k{font-size:10.5px;color:var(--text-faint);font-weight:700;line-height:1.45;word-break:keep-all}
.slot.f .k{color:var(--tone-hi)}
.slot.dash{border-style:dashed;border-color:rgba(255,255,255,.16);cursor:pointer}
.item{display:flex;gap:12px;align-items:center;padding:13px 14px;background:var(--glass);
 border:1px solid var(--glass-line);border-radius:14px;margin-bottom:8px;cursor:pointer;
 backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.item:active{border-color:var(--tone-line)}
.item .th{width:40px;height:52px;border-radius:9px;background:rgba(0,0,0,.3);border:1px solid var(--hairline);
 flex:0 0 40px;display:grid;place-items:center;font-size:15px}
.item .bd{min-width:0;flex:1}
.item .ti{font-size:13.5px;font-weight:700;line-height:1.45;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item .st{font-size:11px;color:var(--text-faint);margin-top:4px}
.pill{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--tone-faint);
 color:var(--tone-hi);border:1px solid var(--tone-line);white-space:nowrap;flex:0 0 auto}
.pill.gray{background:transparent;color:var(--text-faint);border-color:var(--hairline)}
.empty{padding:34px 16px;text-align:center;color:var(--text-faint);font-size:13px;line-height:1.7;
 border:1px dashed rgba(255,255,255,.16);border-radius:var(--r)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--glass-line);background:var(--glass);
 color:var(--text-sub);font:700 12.5px Pretendard;cursor:pointer;transition:.16s}
.chip.on{background:linear-gradient(160deg,var(--tone-hi),var(--tone));color:var(--tone-ink);border-color:var(--tone)}

/* ─── 도크 (유리) ─── */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(10,13,18,.55);backdrop-filter:blur(24px);
 -webkit-backdrop-filter:blur(24px);border-top:1px solid var(--hairline);
 padding:7px 6px calc(7px + env(safe-area-inset-bottom))}
.dock .in{display:grid;grid-template-columns:repeat(6,1fr);max-width:480px;margin:0 auto}
.dk{background:none;border:0;color:var(--text-faint);font:600 10.5px Pretendard;cursor:pointer;
 padding:5px 0;display:grid;gap:3px;justify-items:center}
.dk i{font-style:normal;font-size:17px;line-height:1;opacity:.75}
.dk.on{color:var(--tone-hi)}.dk.on i{opacity:1}
.dk.dim{opacity:.34}

/* ─── 상단바 (유리) ─── */
.bar{position:sticky;top:0;z-index:30;background:rgba(10,13,18,.6);backdrop-filter:blur(16px);
 -webkit-backdrop-filter:blur(16px);border-bottom:1px solid transparent;
 transition:border-color .22s ease,box-shadow .22s ease;
 padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
body.scrolled .bar{border-color:var(--hairline);box-shadow:0 8px 22px rgba(0,0,0,.38)}
.bar .back{background:none;border:0;color:var(--text-sub);font:700 13px Pretendard;cursor:pointer;
 padding:6px 8px;border-radius:9px;display:flex;align-items:center;gap:5px}
.bar .rname{font-size:13.5px;font-weight:800;color:var(--tone-hi)}
.bar .sp{flex:1}
.bar .who{font-size:11.5px;color:var(--text-faint)}

/* ─── 로그인 ─── */
#loginGate{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px}
#loginGate::before{content:'';position:absolute;top:-160px;right:-140px;width:520px;height:520px;border-radius:50%;
 background:radial-gradient(circle,rgba(215,243,75,.14),transparent 65%);filter:blur(30px);pointer-events:none}
#loginGate.off{display:none}
.login-box{width:100%;max-width:340px;animation:rise .4s var(--e-out);position:relative}
.login-box .logo{text-align:center;margin-bottom:26px}
.login-box .logo .t{font-size:22px;font-weight:800;letter-spacing:-.02em}
.login-box .logo .s{font-size:12px;color:var(--text-mute);margin-top:6px}
.login-box .btn{background:linear-gradient(160deg,#e6fb84,#d7f34b);box-shadow:0 6px 20px rgba(215,243,75,.2)}
.lmsg{min-height:18px;font-size:12px;color:var(--wine);margin:9px 2px 0;font-weight:600;text-align:center}
.lg-adm{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;z-index:2;text-decoration:none;font-size:15px;
 background:rgba(255,255,255,.06);border:1px solid var(--hairline);border-radius:999px;padding:8px 12px;opacity:.6}
.pinrow{display:flex;gap:10px;justify-content:center;margin-top:10px}
.pinbox{width:52px;height:58px;border-radius:14px;border:1px solid var(--glass-line);background:rgba(0,0,0,.28);
 color:var(--text-main);font:800 24px Pretendard;text-align:center;outline:none;transition:border-color .16s,box-shadow .16s;
 -webkit-text-security:disc;text-security:disc}
.pinbox:focus{border-color:var(--tone-line);box-shadow:0 0 0 3px var(--tone-faint)}
.ln-hub{position:relative;width:300px;height:210px;margin:0 auto 6px}
.ln-links{position:absolute;inset:0;width:100%;height:100%}
.ln-links line{stroke:rgba(255,255,255,.1);stroke-width:1;stroke-dasharray:3 5}
.ln-pod{position:absolute;left:50%;top:105px;width:120px;height:120px;transform:translate(-50%,-50%);border-radius:50%;
 background:radial-gradient(circle,rgba(215,243,75,.16),transparent 70%);filter:blur(10px)}
.ln-core{position:absolute;left:50%;top:105px;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:20px;
 background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(16px);
 box-shadow:0 8px 26px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.15);display:grid;place-items:center;font-size:30px}
.ln-node{position:absolute;transform:translate(-50%,-50%)}
.ln-flo{display:grid;justify-items:center;gap:5px;animation:lnfloat 4.5s ease-in-out infinite}
@keyframes lnfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.ln-tile{width:42px;height:42px;border-radius:14px;background:var(--glass);border:1px solid var(--glass-line);
 backdrop-filter:blur(14px);display:grid;place-items:center;font-size:20px;
 box-shadow:0 6px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12)}
.ln-lab{font-size:10px;color:var(--text-faint);font-weight:700}
@media (prefers-reduced-motion:reduce){.ln-flo{animation:none}}
body.hidden-pause .ln-flo{animation-play-state:paused}
.lmsg.ok{color:var(--ice)}

/* ─── 갈림길 ─── */
.fork{padding:0 18px;display:grid;gap:11px;margin-top:20px}
.door{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--glass-line);
 background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
 box-shadow:0 8px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.14);
 padding:19px 18px;cursor:pointer;text-align:left;
 animation:rise .4s var(--e-out) both}
.door:active{transform:scale(.985)}
.door::before{content:'';position:absolute;top:-40px;right:-40px;width:180px;height:180px;border-radius:50%;
 background:radial-gradient(circle,var(--dg) 0%,transparent 70%);pointer-events:none;filter:blur(6px)}
.door .ic{font-size:23px}
.door .dt{font-size:16.5px;font-weight:800;margin-top:9px;letter-spacing:-.01em}
.door .dd{font-size:12px;color:var(--text-mute);margin-top:5px;line-height:1.55}
.door .dtag{position:absolute;top:15px;right:15px;font-size:10px;font-weight:700;color:var(--text-faint);
 border:1px solid var(--hairline);padding:3px 8px;border-radius:999px}
.door[data-go="basic"]{--dg:rgba(155,196,217,.2)}
.door[data-go="mid"]{--dg:rgba(215,243,75,.16)}
.door[data-go="master"]{--dg:rgba(245,230,211,.15)}
.door[data-go="community"]{--dg:rgba(255,122,51,.18)}
.door[data-go="basic"] .dt{color:var(--ice)}
.door[data-go="mid"] .dt{color:var(--lime)}
.door[data-go="master"] .dt{color:var(--cream)}
.door[data-go="community"] .dt{color:var(--flare)}

/* ─── 시트 (유리) ─── */
.sheetbg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity 480ms var(--e-ios)}
.sheetbg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:480px;margin:0 auto;
 background:rgba(18,22,30,.86);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
 border:1px solid var(--glass-line);border-bottom:0;border-radius:22px 22px 0 0;
 box-shadow:0 -8px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1);
 padding:12px 18px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);
 transition:transform 480ms var(--e-ios);max-height:86dvh;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y}
.sheet.on{transform:none}
.sheet{-webkit-overflow-scrolling:touch}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.22);margin:0 auto 15px}
.sheet h3{font-size:17px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
.sheet .sub{font-size:12.5px;color:var(--text-mute);line-height:1.6;margin-bottom:15px}
.toast{position:fixed;left:50%;bottom:calc(var(--dock-h) + env(safe-area-inset-bottom) + 18px);transform:translateX(-50%) translateY(14px);
 z-index:70;background:rgba(18,22,30,.9);backdrop-filter:blur(18px);border:1px solid var(--tone-line);color:var(--text-main);
 font:700 13px Pretendard;padding:11px 17px;border-radius:999px;opacity:0;pointer-events:none;
 transition:opacity 320ms var(--e-out),transform 320ms var(--e-out);white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}
.note{margin:22px 18px 0;padding:13px 15px;border-left:2px solid var(--tone-line);background:var(--tone-faint);
 border-radius:0 12px 12px 0;font-size:12px;color:var(--text-sub);line-height:1.65}
.note b{color:var(--tone-hi)}
.pipe{display:flex;align-items:stretch;gap:8px}
.stg{flex:1;background:var(--glass);border:1px solid var(--glass-line);border-radius:14px;padding:12px 8px;text-align:center;
 backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.stg .n{font-size:21px;font-weight:800}
.stg .t{font-size:10.5px;color:var(--text-mute);margin-top:3px;font-weight:600}
.stg.act{border-color:var(--tone-line);background:linear-gradient(180deg,var(--tone-faint),var(--glass))}
.stg.act .n{color:var(--tone-hi)}
.arw{align-self:center;color:var(--text-faint);font-size:12px}
.mk{display:inline-block;vertical-align:-3px}
/* ─── 로봇 히어로 (담기·분해의 주인공 — 컨모 덜컹이 문법) ─── */
.bot{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;
 padding:16px 14px 13px;border-radius:18px;background:var(--glass);border:1px solid var(--glass-line);
 backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
 box-shadow:0 8px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.14);transition:border-color .3s;margin-bottom:14px}
.bot.on{border-color:rgba(201,138,91,.4)}
.bot.ok{border-color:var(--tone-line)}
.bot svg.stagevg{width:150px;height:150px;overflow:visible}
.bot .rob{transform-origin:50% 80%}
.bot b{font-size:13.5px;font-weight:800}
.bot s{text-decoration:none;font-size:10px;font-weight:700;color:var(--text-faint)}
.bot.on s{color:#C98A5B}.bot.ok s{color:var(--tone)}
@keyframes rattle{
 0%{transform:rotate(0) translate(0,0)}7%{transform:rotate(-2.4deg) translate(-1.2px,.8px)}
 14%{transform:rotate(1.8deg) translate(1px,-.4px)}22%{transform:rotate(-1deg) translate(-.6px,1px)}
 30%{transform:rotate(2.4deg) translate(1.2px,.4px)}40%,48%{transform:rotate(1.2deg) translate(.6px,1.6px)}
 58%{transform:rotate(-3deg) translate(-1.6px,-.8px)}70%{transform:rotate(4deg) translate(2.4px,1.2px)}
 82%{transform:rotate(-3deg) translate(-1.8px,-.6px)}92%{transform:rotate(1.6deg) translate(1px,.5px)}
 100%{transform:rotate(0) translate(0,0)}}
.bot.on .rob{animation:rattle 1.7s ease-in-out infinite both}
.bot .eye{fill:#242a38;transition:fill .3s}
.bot.on .eye{fill:#C98A5B}
.bot.ok .eye{fill:var(--tone)}
.bot .zzz{opacity:.8;transition:opacity .3s}
.bot.on .zzz,.bot.ok .zzz{opacity:0}
.bot .sheet2{opacity:0}
.bot.ok .sheet2{animation:sheetup .6s cubic-bezier(.34,1.56,.64,1) 1 both}

async function sha256(t){
  if(window.crypto&&crypto.subtle&&crypto.subtle.digest){
    try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
      return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){}
  }
  return pureSha256(t);
}
/* 순수 JS SHA-256 폴백 — crypto.subtle 없는 옛 폰·http 환경용 */
function pureSha256(ascii){
  ascii=unescape(encodeURIComponent(ascii));
  function rr(v,c){return(v>>>c)|(v<<(32-c))}
  var mW=Math.pow,mC=mW(2,32),result='',words=[],aL=ascii.length*8,i,j;
  var hash=pureSha256.h=pureSha256.h||[],k=pureSha256.k=pureSha256.k||[],pC=k.length,isC={};
  for(var cand=2;pC<64;cand++){if(!isC[cand]){for(i=0;i<313;i+=cand)isC[i]=cand;
    hash[pC]=(mW(cand,.5)*mC)|0;k[pC++]=(mW(cand,1/3)*mC)|0}}
  ascii+='\x80';while(ascii.length%64-56)ascii+='\x00';
  for(i=0;i<ascii.length;i++){j=ascii.charCodeAt(i);if(j>>8)return'';words[i>>2]|=j<<((3-i)%4)*8}
  words[words.length]=(aL/mC)|0;words[words.length]=aL;
  for(j=0;j<words.length;){var w=words.slice(j,j+=16),oldHash=hash.slice(0,8);
    for(i=0;i<64;i++){var w15=w[i-15],w2=w[i-2];
      var a=hash[0],e=hash[4];
      var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^(~e&hash[6]))+k[i]
        +(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}
    for(i=0;i<8;i++)hash[i]=(hash[i]+oldHash[i])|0}
  for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16)}
  return result;
}

/* 무차별 대입 잠금: 5회 → 5·10·20…분 (최대 60분) */
function lockInfo(){try{return JSON.parse(localStorage.getItem('cm2_lock')||'{}')}catch(e){return{}}}
function lockLeft(){const L=lockInfo();return L.until&&Date.now()<L.until?Math.ceil((L.until-Date.now())/60000):0}
function lockFail(){const L=lockInfo();L.n=(L.n||0)+1;
  if(L.n>=5){const step=Math.min(60,5*Math.pow(2,(L.rounds||0)));L.until=Date.now()+step*60000;L.rounds=(L.rounds||0)+1;L.n=0}
  localStorage.setItem('cm2_lock',JSON.stringify(L))}
function lockClear(){localStorage.removeItem('cm2_lock')}
let _busy=false;
async function doLogin(){
  if(_busy)return;
  const left=lockLeft();if(left)return lmsg('여러 번 틀려서 잠깐 잠겼어요 — '+left+'분 뒤 다시');
  const code=document.getElementById('inCode').value.trim().toUpperCase();
  const pin=pinVal('pinRow');
  if(!code)return lmsg('코드를 입력해 주세요');
  if(pin.length<4)return lmsg('비밀번호 네 칸을 채워 주세요');
  _busy=true;lmsg('여는 중…',true);
  try{
    const st=await rpc('cm_code_status',{p_code:code});
    if(!st.exists){lockFail();return lmsg('없는 코드예요')}
    if(st.expired)return lmsg('기간이 끝난 코드예요');
    let fn='cm_login';
    if(!st.signedUp){
      const w2=document.getElementById('pin2Wrap');
      if(w2.style.display==='none'){
        w2.style.display='';document.getElementById('btnGo').textContent='비밀번호 만들고 들어가기';
        document.querySelector('#pinRow2 .pinbox').focus();
        return lmsg('처음이시네요 — 아래 칸에 한 번 더',true);
      }
      if(pinVal('pinRow2')!==pin)return lmsg('두 비밀번호가 서로 달라요');
      fn='cm_signup';
    }
    const h=await pinHash(code,pin);
    const r=await rpc(fn,{p_code:code,p_pin_hash:h});
    if(!r.ok){
      const m={badpin:'비밀번호가 달라요',expired:'기간이 끝난 코드예요',notfound:'없는 코드예요',already:'이미 가입된 코드예요'};
      if(r.reason==='badpin'||r.reason==='notfound')lockFail();
      return lmsg(m[r.reason]||'들어가지 못했어요');
    }
    lockClear();
    AUTH={code:r.user.code,pinHash:h,name:r.user.name||r.user.code};
    localStorage.setItem('cm2_auth',JSON.stringify(AUTH));
    await afterLogin();
  }catch(e){lmsg('연결이 잠깐 막혔어요. 다시 눌러 주세요')}
  finally{_busy=false}
}

/* ── 성적표 — 인스타 유입/전환 갈라 보기 (옛 앱 v742 연동 공법·키 재사용) ── */
const IG_BASE='https://graph.instagram.com/v23.0';
async function igFetch(tk){
  const pr=await(await fetch(IG_BASE+'/me?fields=username,followers_count,media_count&access_token='+encodeURIComponent(tk))).json();
  if(pr.error)throw new Error(pr.error.message||'token');
  const md=await(await fetch(IG_BASE+'/me/media?fields=id,caption,media_type,media_product_type,timestamp,thumbnail_url,media_url,permalink&limit=30&access_token='+encodeURIComponent(tk))).json();
  const items=md.data||[];const out=[];
  for(let i=0;i<items.length;i+=10){
    const part=await Promise.all(items.slice(i,i+10).map(async m=>{
      let ins={};
      try{
        const met=(m.media_product_type==='REELS')?'views,reach,saved,shares,total_interactions':'views,reach,saved,shares,total_interactions';
        const r=await(await fetch(IG_BASE+'/'+m.id+'/insights?metric='+met+'&access_token='+encodeURIComponent(tk))).json();
        (r.data||[]).forEach(d=>{ins[d.name]=(d.values&&d.values[0]&&d.values[0].value)||0});
      }catch(e){}
      return Object.assign({},m,{ins});
    }));
    out.push.apply(out,part);
  }
  return {t:Date.now(),profile:pr,media:out};
}
async function igSync(force){
  const tk=localStorage.getItem('cm-mya-igtk');if(!tk)return null;
  let c=null;try{c=JSON.parse(localStorage.getItem('cm2_ig')||'null')}catch(e){}
  if(!force&&c&&c.t&&(Date.now()-c.t)<6*3600*1000)return c;   // 6시간 캐시 — 발열·쿼터 아낌
  try{const d=await igFetch(tk);localStorage.setItem('cm2_ig',JSON.stringify(d));return d}
  catch(e){toast('인스타 연결 오류 — 토큰이 만료됐을 수 있어요');return c||null}
}
function igNum(n){n=n||0;if(n>=10000)return(n/10000).toFixed(n>=100000?0:1)+'만';return Number(n).toLocaleString()}
function igClass(m){  // 유입형/전환형 이름표 — 저장+공유 비중으로
  const v=(m.ins&&m.ins.views)||(m.ins&&m.ins.reach)||0;
  const cv=((m.ins&&m.ins.saved)||0)+((m.ins&&m.ins.shares)||0);
  return (cv>=5&&v>0&&cv/v>=0.008)?'cv':'in';
}
async function renderScore(){
  const box=document.getElementById('scoreBox');if(!box)return;
  const tk=localStorage.getItem('cm-mya-igtk');
  if(!tk){
    box.innerHTML='<section><div class="lbl">성적표</div><div class="card">'+
    '<p class="muted" style="margin-bottom:11px">인스타 계정을 연결하면 실적이 <b style="color:var(--text-main)">유입/전환</b>으로 갈라져 보여요. 토큰은 <b style="color:var(--text-main)">이 기기에만</b> 저장돼요.</p>'+
    '<input class="inp" id="igTk" placeholder="인스타 액세스 토큰 붙여넣기">'+
    '<button class="btn" style="margin-top:11px" onclick="igConnect()">연결하기</button></div></section>';
    return;
  }
  box.innerHTML='<section><div class="lbl">성적표 · 최근 30개</div><div class="card"><p class="muted">불러오는 중…</p></div></section>';

    box.innerHTML='<section><div class="lbl">성적표</div><div class="card"><p class="muted">아직 불러올 실적이 없어요. <b style="color:var(--text-main);cursor:pointer" onclick="igReset()">연결 다시 하기</b></p></div></section>';
    return;
  }
  const M=d.media.filter(m=>m.ins&&(m.ins.views||m.ins.reach));
  const sum=k=>M.reduce((s2,m)=>s2+((m.ins&&m.ins[k])||0),0);
  const vIn=sum('views')||sum('reach');
  const saved=sum('saved'),shares=sum('shares');
  const vCv=saved+shares;
  const nCv=M.filter(m=>igClass(m)==='cv').length;
  const rate=vIn?(vCv/vIn*100):0;
  // «할 것 하나» — 신호등 문법: 어디가 비었나
  let todo;
  if(!M.length)todo='실적이 잡히는 릴스가 아직 없어요 — 이번 주 하나 올려보세요';
  else if(rate<0.5)todo='저장을 부르는 콘텐츠가 부족해요 — 공식 서재에서 뼈대 하나 골라 전환용으로 만들어 보세요';
  else if(nCv<2)todo='전환형이 '+nCv+'개뿐이에요 — 유입형 사이에 전환용 하나를 끼워 넣을 차례예요';
  else todo='유입·전환이 같이 돌고 있어요 — 상품 판을 점검하고 DM 동선을 붙일 때예요';
  box.innerHTML='<section><div class="lbl">성적표 · @'+esc(d.profile.username||'')+' · 최근 '+M.length+'개'+
  ' <span style="cursor:pointer" onclick="renderScoreForce()">↻</span></div>'+
  '<div class="card hi" style="margin-bottom:10px;padding:13px 15px"><div style="font-size:13.5px;font-weight:800;line-height:1.55">'+todo+'</div></div>'+
  '<div class="row">'+
  '<div class="stg" style="flex:1;cursor:pointer" onclick="openScoreList(\'in\')"><div class="n" style="color:var(--ice)">'+igNum(vIn)+'</div><div class="t">🌊 유입 (조회·도달)</div></div>'+
  '<div class="stg act" style="flex:1;cursor:pointer" onclick="openScoreList(\'cv\')"><div class="n">'+igNum(vCv)+'</div><div class="t">💰 전환 (저장 '+igNum(saved)+' · 공유 '+igNum(shares)+')</div></div>'+
  '</div>'+
  '<p class="muted" style="margin-top:9px">유입 100명당 전환 신호 '+(vIn?(vCv/vIn*100).toFixed(1):'0')+'개 · 기둥을 누르면 콘텐츠별로 펼쳐져요</p></section>';
}

function gameLabel(){

function gameStart(){
  _gScore=0;_gLeft=60;
  if(ROOM==='basic')_gQueue=S.cards.filter(c=>c.stage===0).slice();
  else if(ROOM==='mid')_gQueue=S.cards.filter(c=>c.stage===2).slice();
  else _gQueue=S.cards.filter(c=>c.stage>=3&&c.notes&&c.notes.hook&&c.notes.frame).sort(()=>((_gScore+_gQueue.length)%2)?-1:1).slice();
  if(!_gQueue.length)return toast('지금은 정리할 게 없어요');
  gameTick(true);
  clearInterval(_gT);_gT=setInterval(()=>{
    _gLeft--;const f=document.getElementById('gFill'),n=document.getElementById('gNum');
    if(f)f.style.width=(_gLeft/60*100)+'%';if(n)n.textContent=_gLeft;
    if(_gLeft<=0)gameEnd();
  },1000);
}
function gameHead(){
  return'<div class="gtimer"><div class="gbar"><div class="gfill" id="gFill"></div></div><div class="gnum" id="gNum">'+_gLeft+'</div></div>'+
  '<div class="gscore" style="margin-bottom:12px">정리한 것 · '+_gScore+'개</div>';
}
function gameTick(first){
  if(!_gQueue.length)return gameEnd();
  const c=_gQueue[0];
  if(ROOM==='basic'){
    openSheet('<h3>이거 왜 멈춰서 봤어요?</h3><div class="sub">'+esc(cardTitle(c))+'</div>'+gameHead()+
    '<textarea class="inp" id="gWhy2" rows="2" placeholder="한 줄이면 돼요"></textarea>'+
    '<div class="row" style="margin-top:12px"><button class="btn" style="flex:2" onclick="gameAnswerWhy(\''+c.id+'\')">다음 →</button>'+
    '<button class="btn ghost" style="flex:1" onclick="gameSkip()">넘기기</button></div>');
  }else if(ROOM==='mid'){
    openSheet('<h3>어느 선반에?</h3><div class="sub">'+esc(cardTitle(c))+(c.notes&&c.notes.why?' — '+esc(c.notes.why):'')+'</div>'+gameHead()+
    '<div class="chips">'+S.cats.map(k=>'<button class="chip" onclick="gameAnswerCat(\''+c.id+'\',\''+esc(k)+'\')">'+esc(k)+'</button>').join('')+'</div>'+
    '<button class="btn ghost" style="margin-top:12px" onclick="gameSkip()">넘기기</button>');
  }else{
    const pool=[...new Set(S.cards.filter(x=>x.stage>=3&&x.notes&&x.notes.frame).map(x=>x.notes.frame))];
    const opts=[c.notes.frame,...pool.filter(f=>f!==c.notes.frame)].slice(0,3);

    openSheet('<h3>이 훅의 뼈대는?</h3><div class="sub">훅 · «'+esc(c.notes.hook)+'»</div>'+gameHead()+

  }
  if(first){/* 시트 이미 열림 */}
}

  const v=document.getElementById('gWhy2').value.trim();if(!v)return toast('한 줄만!');

function gameAnswerCat(id,cat){
  const c=S.cards.find(x=>x.id===id);if(c){c.cat=cat;c.stage=3}

}
function gameAnswerQuiz(id,ans){
  const c=S.cards.find(x=>x.id===id);

  toast(ok?'맞았어요!':'아까워요 — '+(c?c.notes.frame:''));
  _gQueue.shift();if(ok)_gScore++;
  if(!_gQueue.length)return gameEnd();gameTick();
}
function gameEnd(){
  clearInterval(_gT);_gT=null;closeSheet();buildDock();render();

  else if(_gScore>0)toast(_gScore+'개 정리했어요');
}

function botWake(){const b=document.getElementById('botHero');if(!b)return;
  if(!b.classList.contains('on')&&!b.classList.contains('ok')){b.classList.add('on');
    const st=document.getElementById('botState');if(st)st.textContent='덜컹덜컹 — 일하는 중…'}}
function botDone(after){const b=document.getElementById('botHero');
  if(!b){if(after)after();return}
  b.classList.add('on');b.classList.remove('ok');
  const st=document.getElementById('botState');if(st)st.textContent='덜컹덜컹 — 일하는 중…';
  setTimeout(()=>{const b2=document.getElementById('botHero');if(!b2){if(after)after();return}
    b2.classList.remove('on');b2.classList.add('ok');
    const st2=document.getElementById('botState');if(st2)st2.textContent='됐다! 선반에 올려뒀어요';
    setTimeout(()=>{if(after)after()},900);
  },1100);
}

function renderBunryu(){
  const isMaster=ROOM==='master';
  const inbox=S.cards.filter(c=>c.stage===2);
  const sorted=S.cards.filter(c=>c.stage>=3);
  let h='<div class="top"><div class="h1">'+(isMaster?'<em>공식 서재</em>':'미분류를 <em>정리해요</em>')+'</div></div>';

    if(!sorted.length)return h+'<section><div class="empty">아래 방에서 분해·분류된 것들이<br>여기 공식으로 쌓여요. 아직 비어 있어요.</div></section>';
    const fq2={};sorted.forEach(c=>{const f=(c.notes&&c.notes.frame||'').trim();if(f)fq2[f]=(fq2[f]||0)+1});
    const top2=Object.entries(fq2).sort((a,b)=>b[1]-a[1]).slice(0,4);
    if(top2.length)h+='<section><div class="lbl">내 공식 — 반복되는 뼈대</div><div class="chips">'+

    const by={};sorted.forEach(c=>{(by[c.cat||'기타']=by[c.cat||'기타']||[]).push(c)});
    Object.keys(by).forEach(k=>{h+='<section><div class="lbl">'+esc(k)+' · '+by[k].length+'</div>'+
      by[k].map(c=>'<div class="item" data-open="'+c.id+'"><div class="th">📐</div><div class="bd"><div class="ti">'+esc(c.notes&&c.notes.frame||cardTitle(c))+'</div>'+

    return h;
  }
  h+='<section><div class="lbl">미분류 · '+inbox.length+'장</div>';
  h+=inbox.length?inbox.slice().reverse().map(c=>
   '<div class="item" onclick="openSort(\''+c.id+'\')"><div class="th">▦</div><div class="bd"><div class="ti">'+esc(cardTitle(c))+'</div>'+
   '<div class="st">'+esc(c.notes&&c.notes.why||'분해 메모')+'</div></div><span class="pill">분류</span></div>').join('')
   :'<div class="empty">분해가 끝난 카드가 여기로 와요</div>';
  h+='</section>';
  if(sorted.length){
    const by={};sorted.forEach(c=>{(by[c.cat||'기타']=by[c.cat||'기타']||[]).push(c)});
    h+='<section><div class="lbl">분류된 선반</div><div class="chips">'+
     Object.keys(by).map(k=>'<span class="chip on" style="cursor:default">'+esc(k)+' '+by[k].length+'</span>').join('')+'</div></section>';
  }
  return h;
}

      '<div style="text-align:center;font-size:10px;font-weight:800;letter-spacing:.2em;color:#F4D06A;margin:18px 0 4px">— 100일 완주자 —</div>' +
      '<div class="cmu-plq">' +
      (grads.map(function (g) { return '<div class="cmu-pl"><span class="av">' + esc(String(g.nickname || '?').slice(0, 1)) + '</span><b>' + esc(g.nickname) + '</b><small>' + esc(g.room || '') + (g.streak ? ' · 🔥' + g.streak + '주' : '') + '</small></div>'; }).join('')) +
      '<div class="cmu-pl" style="opacity:.45"><span class="av">?</span><b>다음은 당신</b><small>시즌 진행 중</small></div></div></div>' +
      '<button style="background:none;border:0;color:#5d6656;font-size:12px;cursor:pointer;padding:10px 4px" id="cmu-h-back">← 광장으로</button>';
    document.getElementById('cmu-h-back').onclick = function () { _cmuView = 'plaza'; cmuRender(); };
  }
  function cmuRender() {
    const tt = document.getElementById('cmu-tt');
    if (tt) tt.textContent = _cmuView === 'hall' ? '🏛 마스터즈 전당' : _cmuView === 'room' ? '🚪 우리 방' : _cmuView === 'rooms' ? '🚪 커뮤니티방'
      : _cmuView === 'mentor' ? '👩‍🏫 선생님' : '👥 커뮤니티';
    if (_cmuView === 'plaza') cmuRenderPlaza();
    else if (_cmuView === 'rooms') cmuRenderRooms();
    else if (_cmuView === 'create') cmuRenderCreate();
    else if (_cmuView === 'apply') cmuRenderApply();
    else if (_cmuView === 'apps') cmuRenderApps();
    else if (_cmuView === 'room') cmuRenderRoom();
    else if (_cmuView === 'hall') cmuRenderHall();
    try { window.scrollTo({ top: 0 }); document.getElementById('cmu-ov').scrollTop = 0; } catch (e) {}
  }
  // 업적 자동 등록(⌖나 인스타 캐시 → 서버) + 무대 연출(새 업적 1회)
  async function cmuAchSync() {
    try {
      const ig = myaIg(); if (!ig || !window.__cmAuth) return;
      const M = ig.media || [];
      for (const m of M) {
        const v = (m.ins && m.ins.views) || 0;
        const t = String(m.caption || '').split('\n')[0].slice(0, 60) || '(제목 없음)';
        const th = m.thumbnail_url || '';
        if (v >= 1000000) await cmuRpc('cm_ach_add', { p_type: 'm1m', p_value: v, p_title: t, p_thumb: th });
        else if (v >= 100000) await cmuRpc('cm_ach_add', { p_type: 'm100k', p_value: v, p_title: t, p_thumb: th });
      }
      if ((ig.profile.followers_count || 0) >= 10000)
        await cmuRpc('cm_ach_add', { p_type: 'f10k', p_value: ig.profile.followers_count, p_title: '팔로워', p_thumb: ig.profile.profile_picture_url || '' });
    } catch (e) {}
  }
  function cmuStage(a) {   // 정중앙 펼침 무대
    const ov = document.getElementById('cmu-stageov'), card = document.getElementById('cmu-acard');
    if (!ov || !card) return;
    const TYPE = { m100k: '첫 10만', m1m: '첫 100만', f10k: '팔로워 1만' };
    card.innerHTML = '<div class="k">업 적 달 성</div>' +
      '<div class="th"' + (a.thumb ? ' style="background-image:url(' + String(a.thumb).replace(/"/g, '') + ')"' : '') + '><span class="vv">' + myaN(a.value) + '</span></div>' +
      '<div class="big"><em>' + (TYPE[a.type] || '') + '</em>을 넘었다</div>' +
      '<div class="who">' + esc(a.nickname || '나') + (a.title ? ' · "' + esc(a.title) + '"' : '') + '</div>' +
      '<span class="x" id="cmu-stage-x">👏 멋지다!</span>';
    ov.classList.add('show');
    document.getElementById('cmu-stage-x').onclick = function () { ov.classList.remove('show'); };
  }
  // 갈림길 신청 배지
  async function cmuForkBadge() {
    try {
      const box = document.getElementById('cmu-forkmsg'); if (!box || !window.__cmAuth) return;
      const r = await cmuRpc('cm_room_apps');
      const n = (r && r.ok && r.apps) ? r.apps.length : 0;
      box.classList.toggle('show', n > 0);
      const nn = document.getElementById('cmu-forkmsg-n'); if (nn) nn.textContent = n;
    } catch (e) {}
  }
  window.cmuRender=cmuRender;window.cmuAchSync=cmuAchSync;window._cmuSetView=function(v){_cmuView=v;cmuRender()};window._cmuGoRoom=function(c){_cmuRoomCode=c;_cmuView='room';cmuRender()};window._cmuState=function(){return _cmuView};
})();

/* ── 커뮤니티 — 옛 컨마 기능 재구성 (서버 배선은 나중, 지금은 내 기기 안에서만) ── */
function wkKey(){const d=new Date();const t=new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7));
 const y=t.getFullYear();const j4=new Date(y,0,4);
 const w=Math.round(((t-new Date(y,0,4-((j4.getDay()+6)%7)))/864e5)/7)+1;return y+'-'+String(w).padStart(2,'0')}
function renderCommunity(){
  document.getElementById('barRoom').textContent='커뮤니티';
  window.__cmAuth=AUTH;
  const wk=S.weekly&&S.weekly[wkKey()];
  document.getElementById('tabbody').innerHTML=
  '<div class="top" style="padding-bottom:2px"><div class="h1" id="cmu-tt">👥 커뮤니티</div></div>'+
  '<section style="margin-top:12px"><div id="cmu-body"></div></section>'+
  '<section id="sec-weekly" style="display:none"><div class="cmu-lbl">✍️ 이번 주 성적 · '+wkKey()+'</div><div class="cmu-card">'+
  (wk?'<div class="pipe">'+
    '<div class="stg"><div class="n">'+Number(wk.followers||0).toLocaleString()+'</div><div class="t">팔로워</div></div>'+
    '<div class="stg"><div class="n">'+Number(wk.best||0).toLocaleString()+'</div><div class="t">최고 조회</div></div>'+
    '<div class="stg"><div class="n">'+(wk.uploads||0)+'</div><div class="t">업로드</div></div></div>'+
    '<button class="btn ghost" style="margin-top:12px" onclick="openWeekly()">고치기</button>'
   :'<p class="muted" style="margin-bottom:11px">주 1회, 세 숫자만 — 팔로워 · 최고 조회수 · 업로드 수.<br>방 판과 내 추이가 이 표를 읽어요. (인스타 연동하면 자동)</p>'+
    '<button class="btn" onclick="openWeekly()">이번 주 성적 적기</button>')+
  '</div></section>'+
  '<section id="sec-wall"><div class="cmu-lbl">🧱 로비 담벼락 — 한 줄 남기기</div><div class="cmu-card">'+
  '<textarea class="inp" id="wallBody" rows="2" placeholder="이번 주 한 일, 다짐, 응원 — 뭐든 한 줄" style="background:rgba(0,0,0,.3)"></textarea>'+
  '<button class="cmu-go" style="width:100%;margin-top:10px" onclick="postWall()">담벼락에 붙이기</button></div>'+
  '<div id="wallList" style="margin-top:10px"><div class="empty">불러오는 중…</div></div></section>'+
  '<section><button class="btn ghost" onclick="goFork()">갈림길로</button></section>';
  show('scr-room');loadWall();
  // 성적은 «방 안» 물건, 담벼락은 «로비» 물건 — 화면 제목을 보고 토글
  const _tt=document.getElementById('cmu-tt');
  if(_tt&&!_tt._mo){_tt._mo=new MutationObserver(()=>{
    const v=(window._cmuState&&window._cmuState())||'plaza';
    const w=document.getElementById('sec-weekly'),l=document.getElementById('sec-wall');
    if(w)w.style.display=(v==='room')?'':'none';
    if(l)l.style.display=(v==='plaza')?'':'none';
  });_tt._mo.observe(_tt,{childList:true,characterData:true,subtree:true})}
  (async()=>{
    try{
      const ms=await rpc('cm_room_mystate',{p_code:AUTH.code,p_pin_hash:AUTH.pinHash});
      const myR=(ms&&ms.ok&&ms.mine||[]).find(m=>m.state==='active');
      if(myR){window._cmuGoRoom(myR.room);return}
    }catch(e){}
    _cmuSetView('plaza');
  })();
  try{cmuAchSync()}catch(e){}
}
function openWeekly(){
  const wk=S.weekly&&S.weekly[wkKey()]||{};
  openSheet('<h3>이번 주 성적</h3><div class="sub">'+wkKey()+' 주 — 세 숫자면 돼요. 대충이어도 적는 게 이겨요.</div>'+
  '<div class="lbl">팔로워 수</div><input class="inp" id="wkF" inputmode="numeric" value="'+(wk.followers||'')+'" placeholder="예) 1240">'+
  '<div class="lbl" style="margin-top:12px">이번 주 최고 조회수</div><input class="inp" id="wkB" inputmode="numeric" value="'+(wk.best||'')+'" placeholder="예) 8300">'+
  '<div class="lbl" style="margin-top:12px">이번 주 업로드 수</div><input class="inp" id="wkU" inputmode="numeric" value="'+(wk.uploads||'')+'" placeholder="예) 3">'+
  '<button class="btn" style="margin-top:14px" onclick="saveWeekly()">기록하기</button>');
}
async function saveWeekly(){
  const f=parseInt(wkF.value.replace(/[^0-9]/g,''))||0,b=parseInt(wkB.value.replace(/[^0-9]/g,''))||0,u=parseInt(wkU.value.replace(/[^0-9]/g,''))||0;
  if(!f&&!b&&!u)return toast('한 칸이라도 적어주세요');
  (S.weekly=S.weekly||{})[wkKey()]={followers:f,best:b,uploads:u,ts:Date.now()};
  save();
  try{await rpc('cm_weekly_set',{p_code:AUTH.code,p_pin_hash:AUTH.pinHash,p_followers:f||null,p_best_views:b||null,p_uploads:u||null})}catch(e){}
  closeSheet();renderCommunity();toast('이번 주 성적을 적었어요 — 방 판에도 반영돼요');
}
function makeRoom2(){
  const name=document.getElementById('r2Name').value.trim();
  const pin=document.getElementById('r2Pin').value.trim();
  if(!name)return toast('방 이름을 지어주세요');
  if(!pin)return toast('입장 비밀번호를 정해주세요');
  if(!document.getElementById('r2Agree').checked)return toast('성적 공유 동의에 체크해주세요');
  const code=Array.from({length:6},(_,i)=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[(Date.now()+i*7)%31]).join('');
  S.room2={name,code,notice:'',ts:Date.now()};
  save();renderCommunity();toast('🚪 방이 열렸어요 — 초대 카드를 뿌리세요');
}
function copyInvite(){
  const r=S.room2;if(!r)return;
  const txt='🚪 «'+r.name+'» 방에 초대해요!\n컨텐츠 마스터즈 앱 → 커뮤니티 → 코드로 들어가기\n방 코드: '+r.code;
  if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast('초대 카드를 복사했어요'));
  else toast('복사가 안 되는 기기예요');
}
function editNotice(){
  const r=S.room2;if(!r)return;
  openSheet('<h3>공지 한 줄</h3><div class="sub">방 맨 위에 붙어요</div>'+
  '<input class="inp" id="ntc" value="'+esc(r.notice||'')+'" placeholder="예) 이번 주 목표 12편!">'+
  '<button class="btn" style="margin-top:13px" onclick="S.room2.notice=ntc.value.trim();save();closeSheet();renderCommunity();toast(\'공지를 붙였어요\')">붙이기</button>');
}
function leaveRoom2(){
  if(!confirm('방을 없앨까요? (아직 이 기기에만 있는 방이에요)'))return;
  S.room2=null;save();renderCommunity();toast('방을 없앴어요');
}

async function loadWall(){
  const box=document.getElementById('wallList');if(!box)return;
  try{
    const r=await rpc('cm2_wall_get',{p_code:AUTH.code,p_pin_hash:AUTH.pinHash});
    if(!r.ok)throw 0;
    // 진짜 벽: 글마다 id 시드로 자리·기울기·분필색이 정해진다 (새로고침해도 같은 자리)
    const seed=n=>{let x=Math.sin(n*127.1)*43758.5453;return x-Math.floor(x)};
    const H=Math.max(280,90+r.posts.length*74);
    box.innerHTML='<div class="wallboard" style="min-height:'+H+'px">'+
     (r.posts.length?r.posts.map((p,i)=>{
       const s1=seed(p.id),s2=seed(p.id*7+3),s3=seed(p.id*13+5);
       const col=(i%2===0)?(4+s1*24):(52+s1*18);          // 좌/우 교대 + 흔들림(%)
       const top=26+i*68+(s2*26-13);                      // 차곡차곡 + 삐뚤빼뚤(px)
       const rot=(s3*12-6).toFixed(1);
       return '<div class="graf c'+(p.id%6)+'" data-wid="'+p.id+'" style="left:'+col.toFixed(1)+'%;top:'+top.toFixed(0)+'px;transform:rotate('+rot+'deg)">'+
        esc(p.body)+'<small>— '+esc(p.name||'누군가')+' · '+daysAgo(p.created_ms)+'</small>'+
        (p.mine?'<button class="gx" onclick="delWall('+p.id+')">✕</button>':'')+'</div>';
     }).join('')
     :'<div class="graf-empty">아직 빈 벽 —<br>첫 낙서를 남겨보세요 ✏️</div>')+'</div>';
  }catch(e){box.innerHTML='<div class="empty">담벼락을 못 불러왔어요 — 잠시 뒤 다시</div>'}
}
const BAD_WORDS=/시발|씨발|씨빨|ㅅㅂ|ㅆㅂ|병신|ㅂㅅ|지랄|ㅈㄹ|좆|존나|ㅈㄴ|새끼|섹스|야동|야사|자위|보지|자지|딸딸이|창녀|걸레년|개년|니미|엠창|애미|느금/i;
function textAllowed(t){
  if(BAD_WORDS.test(String(t||'')))return false;
  return true;
}
window.textAllowed=textAllowed;
async function postWall(){
  const b=document.getElementById('wallBody').value.trim();
  if(!b)return toast('한 줄만 적어주세요');
  if(!textAllowed(b))return toast('여기엔 담기 어려운 말이 섞여 있어요');
  try{const r=await rpc('cm2_wall_post',{p_code:AUTH.code,p_pin_hash:AUTH.pinHash,p_name:AUTH.name,p_body:b});
    if(!r.ok)throw 0;document.getElementById('wallBody').value='';toast('담벼락에 붙였어요');loadWall();
  }catch(e){toast('지금은 안 붙여져요 — 잠시 뒤 다시')}
}
async function delWall(id){
  var row=document.querySelector('#wallList [data-wid="'+id+'"]');
  if(row){row.style.transition='opacity .3s var(--e-out), transform .3s var(--e-out)';
    row.style.opacity='0';row.style.transform+=' scale(.8)'}
  try{await rpc('cm2_wall_del',{p_code:AUTH.code,p_pin_hash:AUTH.pinHash,p_id:id});toast('뗐어요');setTimeout(loadWall,450)}catch(e){loadWall()}
}
function removeRow(el){
  var rest=[],n=el.nextElementSibling;
  while(n){rest.push(n);n=n.nextElementSibling}
  var h=el.offsetHeight+8;
  el.style.transition='opacity 140ms var(--e-out), transform 140ms var(--e-out)';
  el.style.opacity='0';el.style.transform='scale(.94)';
  setTimeout(function(){
    el.remove();
    rest.forEach(function(r){r.style.transition='none';r.style.transform='translateY('+h+'px)'});
    void document.body.offsetWidth;
    rest.forEach(function(r){r.style.transition='transform 260ms var(--e-out)';r.style.transform='translateY(0)'});
  },140);
}

/* ═══════════ 시작/* ═══════════ 시작 ═══════════ */
(async function boot(){
  try{const a=JSON.parse(localStorage.getItem('cm2_auth')||'null');
    if(a&&a.code&&a.pinHash){AUTH=a;
      const r=await rpc('cm_login',{p_code:a.code,p_pin_hash:a.pinHash});
      if(r.ok){AUTH.name=r.user.name||r.user.code;return afterLogin()}
      localStorage.removeItem('cm2_auth');AUTH=null;}
  }catch(e){}
})();
</script>
