<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>정상에서 보이는 것</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--lime:#d7f34b;--lime-hi:#e6fb84;--sky:#8EC7F6;--gold:#F4D06A;
 --tx1:#fff;--tx2:rgba(255,255,255,.62);--tx3:rgba(255,255,255,.35)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Pretendard,-apple-system,sans-serif;background:#07090c;color:var(--tx1);-webkit-font-smoothing:antialiased;
 min-height:100dvh;display:grid;place-items:center;padding:20px 14px}
.wrap{width:100%;max-width:460px}
.hero{position:relative;border-radius:22px;overflow:hidden;border:1px solid rgba(255,255,255,.1);height:380px;
 background:radial-gradient(130% 90% at 50% 0%,#0c1420 0%,#080d15 46%,#05070a 78%,#030405);
 box-shadow:0 24px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.08)}

/* 별 — 그냥 별과, «전당의 불빛»인 별 */
.st{position:absolute;width:2px;height:2px;border-radius:50%;background:#cfe4ff;animation:tw 3.2s ease-in-out infinite}
.st.hall{width:3.5px;height:3.5px;background:var(--gold);box-shadow:0 0 8px rgba(244,208,106,.8);animation-duration:2.4s}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.95}}

/* 네온 «100일, 함께» — 정상 너머 하늘에 걸린 목적지. 한 번 지직이며 켜지고, 그 뒤엔 은은히 숨쉰다 */
.neon{position:absolute;left:0;right:0;top:40px;text-align:center;font-size:24px;font-weight:900;letter-spacing:.03em;
 color:var(--lime);text-shadow:0 0 8px rgba(215,243,75,.7),0 0 30px rgba(215,243,75,.3);
 animation:ignite 7s steps(1,end) 1 both, breathe 4.5s ease-in-out 7s infinite}
.neon small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.4em;color:var(--sky);margin-top:7px;
 text-shadow:0 0 10px rgba(142,199,246,.55)}
@keyframes ignite{0%,8%{opacity:0}9%,11%{opacity:.7}12%,15%{opacity:.1}16%,19%{opacity:1}20%,22%{opacity:.25}23%,100%{opacity:1}}
@keyframes breathe{0%,100%{text-shadow:0 0 8px rgba(215,243,75,.7),0 0 30px rgba(215,243,75,.3)}
 50%{text-shadow:0 0 10px rgba(215,243,75,.9),0 0 44px rgba(215,243,75,.45)}}
.haze{position:absolute;left:50%;top:34px;width:280px;height:110px;transform:translateX(-50%);
 background:radial-gradient(50% 55% at 50% 50%,rgba(215,243,75,.1),transparent 70%);filter:blur(6px)}

/* 산 — 두 겹 능선 */
.mt2{position:absolute;bottom:0;left:-4%;right:-4%;height:205px;
 background:linear-gradient(196deg,#2a3850 0%,#141c2b 34%,#0a0f17 75%);
 clip-path:polygon(0 100%,10% 72%,52% 10%,70% 62%,86% 42%,100% 100%);
 filter:drop-shadow(0 -1px 0 rgba(190,215,255,.22))}
.mt1{position:absolute;bottom:0;left:-4%;right:-4%;height:135px;
 background:linear-gradient(200deg,#1a2333 0%,#0d1119 40%,#070a10 80%);
 clip-path:polygon(0 100%,22% 78%,44% 88%,60% 26%,80% 66%,100% 40%,100% 100%);
 filter:drop-shadow(0 -1px 0 rgba(190,215,255,.14))}
/* 달빛 능선 하이라이트 — 큰 봉우리 왼쪽 사면 */
.ridge{position:absolute;bottom:0;left:-4%;right:-4%;height:205px;pointer-events:none;
 background:linear-gradient(115deg,rgba(190,215,255,.13),transparent 45%);
 clip-path:polygon(52% 10%,57% 24%,52% 100%,38% 100%)}
/* 정상 깃발 — 네온을 향해 서 있다 */
.flag{position:absolute;left:52%;bottom:184px;transform:translateX(-1px);filter:drop-shadow(0 0 5px rgba(215,243,75,.3))}
.flag .pole{position:absolute;left:0;bottom:0;width:2px;height:16px;background:rgba(230,240,255,.75);border-radius:1px}
.flag .cloth{position:absolute;left:2px;bottom:9px;width:11px;height:7px;background:#e0574b;
 clip-path:polygon(0 0,100% 18%,72% 50%,100% 82%,0 100%);transform-origin:0 50%;animation:flut 1.6s ease-in-out infinite}
@keyframes flut{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.86) skewY(-4deg)}}
/* 로프 + 등반가들 (진짜 멤버 수만큼 앉히는 자리) */
.rope{position:absolute;bottom:124px;left:26%;width:23%;height:2px;background:rgba(255,255,255,.22);transform:rotate(-31deg)}
.clm{position:absolute;font-size:14px;animation:bob 1.9s ease-in-out infinite;filter:drop-shadow(0 2px 6px rgba(0,0,0,.7))}
.clm i{position:absolute;left:50%;top:-13px;transform:translateX(-50%);font-style:normal;font:800 8.5px Pretendard;
 color:#0A0D12;background:var(--lime);border-radius:99px;padding:1.5px 6px;white-space:nowrap;opacity:.95}
.clm.c2{animation-delay:.4s}.clm.c3{animation-delay:.8s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
/* 헤드램프 불빛 — 오르는 사람들의 작은 빛 */
.lamp{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff3c0;box-shadow:0 0 7px rgba(255,240,180,.9);
 animation:tw 1.8s ease-in-out infinite}

/* 카피 */
.cap{position:absolute;left:0;right:0;bottom:0;padding:14px 18px 16px;z-index:4;
 background:linear-gradient(transparent,rgba(3,4,5,.72) 55%)}
.cap b{font-size:15px;display:block;letter-spacing:-.01em}
.cap s{text-decoration:none;font-size:11.5px;color:var(--tx2);display:block;margin-top:4px;line-height:1.55}
.note{margin-top:14px;padding:12px 14px;border-left:2px solid rgba(215,243,75,.4);background:rgba(215,243,75,.06);
 border-radius:0 12px 12px 0;font-size:12px;color:var(--tx2);line-height:1.7}
.note b{color:var(--lime-hi)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>
<body>
<div class="wrap">
  <div class="hero">
    <!-- 하늘: 그냥 별 + 전당의 금빛 불빛 -->
    <i class="st" style="left:10%;top:26px"></i><i class="st" style="left:22%;top:64px;animation-delay:.7s"></i>
    <i class="st" style="left:80%;top:30px;animation-delay:1.4s"></i><i class="st" style="left:90%;top:74px;animation-delay:.4s"></i>
    <i class="st" style="left:33%;top:20px;animation-delay:2s"></i><i class="st" style="left:68%;top:18px;animation-delay:1s"></i>
    <i class="st hall" style="left:16%;top:44px"></i>
    <i class="st hall" style="left:85%;top:52px;animation-delay:1.1s"></i>
    <i class="st hall" style="left:73%;top:96px;animation-delay:.5s"></i>
    <div class="haze"></div>
    <div class="neon">100일, 함께<small>TOGETHER WE RUN</small></div>
    <!-- 산과 사람들 -->
    <div class="mt2"></div><div class="ridge"></div><div class="mt1"></div>
    <span class="flag"><span class="pole"></span><span class="cloth"></span></span>
    <div class="rope"></div>
    <span class="clm" style="left:25%;bottom:98px"><i>문가영</i>🧗</span>
    <span class="clm c2" style="left:37%;bottom:134px"><i>나</i>🧗</span>
    <span class="clm c3" style="left:47%;bottom:164px"><i>김지은</i>🧗</span>
    <i class="lamp" style="left:26.5%;bottom:106px"></i>
    <i class="lamp" style="left:38.5%;bottom:142px;animation-delay:.6s"></i>
    <i class="lamp" style="left:48.5%;bottom:172px;animation-delay:1.2s"></i>
    <div class="cap">
      <b>⛰ 정상에서 보이는 것</b>
      <s>지금 오르는 사람들(진짜 멤버) 위로, 먼저 간 사람들의 금빛 불빛과 «100일, 함께» 네온이 목적지처럼 걸려 있다.</s>
    </div>
  </div>
  <div class="note">
    <b>이 장면의 규칙</b> — 등반가 = 내 방 실제 멤버(이름표까지 진짜). 금빛 별 = 전당에 실제로 오른 사람 수만큼.
    네온(킵하신 F)은 광고판이 아니라 <b>풍경 속의 목적지</b>. 욕망 장면(100만 터짐·입금)은 여기 안 걸고,
    <b>진짜 사건이 난 순간</b>의 업적 무대 연출로 아껴 씁니다.
  </div>
</div>
</body></html>
